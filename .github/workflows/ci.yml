name: SmartCI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests and save build log
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee build.log

      - name: Summarize errors using AI
        if: steps.tests.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/summarize_logs.py

      - name: Upload build logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-reports
          path: |
            build.log
            error_summary.md
          if-no-files-found: ignore